<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我永远不会放过你们</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    /* font-family: "Microsoft YaHei", sans-serif; */
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
}

/* 弹幕样式 */
.danmu {
    position: absolute;
    white-space: nowrap;
    font-size: 36px;
    /* font-weight: bold; */
    pointer-events: none;
    will-change: transform; /* GPU加速提示 */
}

/* 弹幕动画 */
@keyframes danmuMove {
    from {
        transform: translateX(100vw);
    }
    to {
        transform: translateX(-120%);
    }
}
</style>
</head>

<body>

<script>
const messages = [
    "險ｱ縺輔↑縺�",
    "險ｱ縺帙↑縺�",
    "謌第ｰｸ霑應ｸ堺ｼ壽叛霑�ｽ�莉ｬ",
    "螳ｳ陌ｫ逵滓弍譛牙､溷､夂噪蜻｢",
    "菴�莉ｬ蛛壻ｺ�ｻ荵域�驛ｽ遏･驕�",
    "🫣🫣🫣"
];

// 随机红色亮度
function randomRedColor() {
    const r = Math.floor(Math.random() * 155) + 100; // 100~255
    return `rgb(${r},0,0)`;
}

function createDanmu() {
    const danmu = document.createElement("div");
    danmu.className = "danmu";

    danmu.innerText = messages[Math.floor(Math.random() * messages.length)];
    danmu.style.color = randomRedColor();

    // 随机高度
    const top = Math.random() * (window.innerHeight - 40);
    danmu.style.top = top + "px";

    // 随机速度（动画时长）
    const duration = Math.random() * 6 + 6; // 6~12秒
    danmu.style.animation = `danmuMove ${duration}s linear`;

    document.body.appendChild(danmu);

    // 动画结束自动删除
    danmu.addEventListener("animationend", () => {
        danmu.remove();
    });
}

// 生成频率控制
setInterval(createDanmu, 400); // 可调（越小越密）
</script>

</body>
</html>
